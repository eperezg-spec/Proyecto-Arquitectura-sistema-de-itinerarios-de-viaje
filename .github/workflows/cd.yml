# Despliegue continuo de EJEMPLO: al crear un tag vX.Y.Z (o merge a main)
#   1) construye y publica las imágenes en GitHub Container Registry (ghcr.io)
#   2) "despliega" levantando el sistema completo en el runner y corre un smoke test
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: airport-service, context: services/airport-service, dockerfile: services/airport-service/Dockerfile }
          - { name: itinerary-service, context: services/itinerary-service, dockerfile: services/itinerary-service/Dockerfile }
          - { name: auth-service, context: services/auth-service, dockerfile: services/auth-service/Dockerfile }
          - { name: notification-connector, context: functions, dockerfile: functions/notification-connector/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest

  deploy-demo:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar (docker compose)
        run: docker compose up -d --build --wait auth-service airport-service itinerary-service gateway
      - name: Smoke test
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/token -H 'Content-Type: application/json' \
            -d '{"username":"viajero","password":"viajero123"}' | python -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          curl -sf http://localhost:8080/api/v1/itineraries -H "Authorization: Bearer $TOKEN"
          echo "Smoke test OK"
      - if: always()
        run: docker compose down -v
