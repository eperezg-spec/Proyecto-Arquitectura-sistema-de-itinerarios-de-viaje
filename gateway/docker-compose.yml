# Compose PROPIO del API Gateway (nginx) + frontend estático.
# Necesita los servicios internos: úsalo desde el docker-compose.yml de la raíz.
name: gateway

services:
  gateway:
    build:
      context: ..                    # la raíz del repo: la imagen copia frontend/
      dockerfile: gateway/Dockerfile
    image: itinerario/gateway:latest
    ports:
      - "8080:80"
    restart: on-failure

networks:
  default:
    name: itinerario-net
