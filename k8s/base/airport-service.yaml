# Airport Service: 2 réplicas (si Chaos Mesh mata una, la otra sigue atendiendo).
#   8000  -> REST (lo usa el gateway)
#   50051 -> gRPC con mTLS (lo usa el itinerary-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airport-service
  labels: { app: airport-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: airport-service }
  template:
    metadata:
      labels: { app: airport-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: airport-service
          image: itinerario/airport-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
            - { containerPort: 50051, name: grpc }
          envFrom:
            - configMapRef: { name: itinerario-config }
          env:
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: itinerario-infra, key: AIRPORT_VAULT_TOKEN } }
          readinessProbe:   # ¿puede recibir tráfico?
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:    # ¿sigue vivo? si no, Kubernetes lo reinicia
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: airport-service
spec:
  selector: { app: airport-service }
  ports:
    - { port: 8000, name: http, targetPort: http }
    - { port: 50051, name: grpc, targetPort: grpc }
---
# Escalado horizontal automático: de 2 a 5 réplicas si la CPU pasa del 70 %.
# (requiere metrics-server en el clúster)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airport-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: airport-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
