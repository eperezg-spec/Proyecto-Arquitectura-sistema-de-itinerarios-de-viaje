# Configuración de Alembic (migraciones versionadas de la BD).
# La URL de la base de datos se toma de la variable de entorno DATABASE_URL (ver migrations/env.py).
#   Aplicar migraciones:   alembic upgrade head
#   Crear una nueva:       alembic revision -m "descripcion"
[alembic]
script_location = migrations
# Permite que migrations/env.py importe el paquete "app"
prepend_sys_path = .
