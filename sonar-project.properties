# Análisis de SonarQube de todo el monorepo.
#   Local:  docker compose --profile quality up -d sonarqube  -> http://localhost:9000 (admin/admin)
#           generar coverage.xml en cada servicio y luego ejecutar sonar-scanner
#   CI:     ver .github/workflows/ci.yml (job "sonar")
sonar.projectKey=itinerario
sonar.projectName=Sistema de Itinerarios Personales
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=services/airport-service/app,services/itinerary-service/app,services/auth-service/app,functions,frontend
sonar.tests=services/airport-service/tests,services/itinerary-service/tests,services/auth-service/tests,functions/send-notification/tests
sonar.exclusions=**/migrations/**,**/tests/**
sonar.python.coverage.reportPaths=services/*/coverage.xml,functions/send-notification/coverage.xml
